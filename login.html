<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mikelo - Iniciar Sesión</title>
    <!-- AdminLTE CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(150deg, #c0392b 0%, #e67e22 60%, #f4a83a 100%);
            min-height: 100vh;
        }
        .login-box {
            width: 420px;
            margin-top: 8vh;
        }
        .login-logo {
            margin-bottom: 24px;
            text-align: center;
        }
        .logo-icono {
            font-size: 3.2rem;
            color: rgba(255,255,255,0.95);
            margin-bottom: 8px;
        }
        .logo-jarvis {
            letter-spacing: 0.35rem;
            font-size: 1.2rem;
            font-weight: 300;
            color: #ffffff;
            text-transform: uppercase;
        }
        .logo-empresa {
            letter-spacing: 0.2rem;
            font-size: 0.78rem;
            color: rgba(255,255,255,0.7);
            margin-top: 4px;
            text-transform: uppercase;
        }
        .card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 12px 45px rgba(0,0,0,0.25);
        }
        .card-body {
            padding: 2.2rem;
        }
        .login-box-msg {
            color: #666;
            font-size: 0.9rem;
        }
        .btn-primary {
            background: linear-gradient(135deg, #c0392b 0%, #e67e22 100%);
            border: none;
            padding: 12px;
            font-weight: 600;
            letter-spacing: 0.04rem;
            border-radius: 8px;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #a93226 0%, #ca6f1e 100%);
        }
        .input-group-text {
            background: #f8f9fa;
            border-right: none;
            color: #c0392b;
        }
        .form-control {
            border-left: none;
        }
        .form-control:focus {
            box-shadow: none;
            border-color: #ced4da;
        }
        .alert {
            border-radius: 10px;
        }
        .version-info {
            color: rgba(255,255,255,0.65);
            font-size: 0.78rem;
            margin-top: 18px;
            text-align: center;
        }
    </style>
</head>
<body class="hold-transition login-page">
    <div class="login-box">
        <div class="login-logo">
            <div class="logo-icono"><i class="fas fa-ice-cream"></i></div>
            <div class="logo-jarvis">J . A . R . V . I . S</div>
            <div class="logo-empresa">Mikelo &mdash; Neuquén</div>
        </div>
        
        <div class="card">
            <div class="card-body login-card-body">
                <p class="login-box-msg">Ingrese sus credenciales para continuar</p>

                <div id="alertContainer"></div>

                <form id="loginForm">
                    <div class="input-group mb-3">
                        <input type="text" 
                               id="usuario" 
                               class="form-control" 
                               placeholder="Usuario"
                               autocomplete="username"
                               required>
                        <div class="input-group-append">
                            <div class="input-group-text">
                                <span class="fas fa-user"></span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="input-group mb-3">
                        <input type="password" 
                               id="password" 
                               class="form-control" 
                               placeholder="Contraseña"
                               autocomplete="current-password"
                               required>
                        <div class="input-group-append">
                            <div class="input-group-text">
                                <span class="fas fa-lock"></span>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-12">
                            <button type="submit" class="btn btn-primary btn-block" id="btnLogin">
                                <i class="fas fa-sign-in-alt mr-2"></i>Iniciar Sesión
                            </button>
                        </div>
                    </div>
                </form>

            </div>
        </div>
        <div class="version-info">
            Sistema de Gestión de Inventario &mdash; v2.0
        </div>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Bootstrap 4 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- AdminLTE -->
    <script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>
    <!-- Auth Module -->
    <script src="js/auth.js"></script>
    
    <script>
        $(document).ready(async function() {
            const carpetaActual = '/' + window.location.pathname.split('/')[1];

            // Limpiar token si: nunca se guardó entorno, o viene de otro entorno (ej: /mikelo → /test)
            const entornoGuardado = localStorage.getItem('mikelo_entorno');
            if (!entornoGuardado || entornoGuardado !== carpetaActual) {
                localStorage.removeItem('mikelo_token');
                localStorage.removeItem('mikelo_user');
            }
            // Guardar entorno actual
            localStorage.setItem('mikelo_entorno', carpetaActual);

            // Si hay token, validarlo contra el servidor antes de redirigir
            if (MikeloAuth.isAuthenticated()) {
                const valid = await MikeloAuth.validateSession();
                if (valid) {
                    redirectByRole();
                    return;
                } else {
                    // Token inválido o de otro entorno, limpiar silenciosamente
                    localStorage.removeItem('mikelo_token');
                    localStorage.removeItem('mikelo_user');
                }
            }

            // Verificar si la sesión expiró
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('expired') === '1') {
                showAlert('Su sesión ha expirado. Por favor, inicie sesión nuevamente.', 'warning');
            }

            // Manejar submit del formulario
            $('#loginForm').on('submit', async function(e) {
                e.preventDefault();
                
                const usuario = $('#usuario').val().trim();
                const password = $('#password').val();

                if (!usuario || !password) {
                    showAlert('Por favor complete todos los campos', 'warning');
                    return;
                }

                const $btn = $('#btnLogin');
                const originalText = $btn.html();
                
                try {
                    $btn.prop('disabled', true)
                        .html('<i class="fas fa-spinner fa-spin mr-2"></i>Verificando...');

                    const user = await MikeloAuth.login(usuario, password);
                    
                    showAlert(`¡Bienvenido, ${user.nombre}!`, 'success');
                    
                    // Esperar un momento y redirigir
                    setTimeout(() => {
                        redirectByRole();
                    }, 1000);

                } catch (error) {
                    showAlert(error.message || 'Error al iniciar sesión', 'danger');
                    $btn.prop('disabled', false).html(originalText);
                }
            });

            // Focus en usuario
            $('#usuario').focus();
        });

        function showAlert(message, type = 'info') {
            const alertHtml = `
                <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                    ${message}
                    <button type="button" class="close" data-dismiss="alert">
                        <span>&times;</span>
                    </button>
                </div>
            `;
            $('#alertContainer').html(alertHtml);
        }

        function redirectByRole() {
            const user = MikeloAuth.getUser();
            
            if (!user) {
                window.location.href = 'index.html';
                return;
            }

            // Redirigir según rol
            if (user.rol_nivel <= 25) {
                // Planta/Admin -> página principal de movimientos
                window.location.href = 'index.html';
            } else {
                // Franquicia -> stock de su sucursal
                window.location.href = 'stock_sucursal.html';
            }
        }
    </script>
</body>
</html>
